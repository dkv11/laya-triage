<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laya Triage</title>
    <style>
        :root {
            --bg: #f5f6f8;
            --panel: #fff;
            --text: #1d2330;
            --muted: #6b7280;
            --me: #2563eb;
            --border: #e5e7eb;
            --p5: #dc2626;
            --p4: #ea580c;
            --p3: #d97706;
            --p2: #2563eb;
            --p1: #6b7280;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111418;
                --panel: #1b1f26;
                --text: #e5e7eb;
                --muted: #9ca3af;
                --border: #2d333d;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
        }

        header p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 640px;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.4;
        }

        .me {
            align-self: flex-end;
            background: var(--me);
            color: #fff;
        }

        .laya {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .laya h4 {
            margin: 10px 0 2px;
            font-size: 13px;
            color: var(--muted);
        }

        .laya ul {
            margin: 4px 0;
            padding-left: 18px;
        }

        .meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            margin-right: 6px;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--panel);
            flex-wrap: wrap;
        }

        #text {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
        }

        #time {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--me);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: wait;
        }
    </style>
</head>

<body>
    <header>
        <h1>Laya</h1>
        <p>Maintenance triage: describe the problem in English, Hindi or Hinglish</p>
    </header>

    <main id="chat"></main>

    <form id="form">
        <input id="text" placeholder="e.g. motor se jalne ki smell aa rahi hai" autocomplete="off" required
            minlength="2">
        <select id="time" title="Simulated plant time">
            <option value="2026-10-10 04:16:00">04:16 · B-201 imbalance starting</option>
            <option value="2026-10-10 05:00:00">05:00 · P-101 healthy</option>
            <option value="2026-10-10 08:10:00" selected>08:10 · B-201 phase imbalance</option>
            <option value="2026-10-10 11:00:00">11:00 · P-101 vibration rising</option>
            <option value="2026-10-10 14:50:00">14:50 · P-101 bearing wear</option>
            <option value="2026-10-10 21:00:00">21:00 · P-101 flow sensor stuck</option>
        </select>

        <button id="send">Send</button>
    </form>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("form");
        const textInput = document.getElementById("text");
        const timeInput = document.getElementById("time");
        const sendBtn = document.getElementById("send");

        const PRIORITY_COLORS = { 5: "var(--p5)", 4: "var(--p4)", 3: "var(--p3)", 2: "var(--p2)", 1: "var(--p1)" };

        // Create an element with safe text (textContent never runs HTML)
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function addList(parent, title, items) {
            parent.append(el("h4", null, title));
            const ul = el("ul");
            for (const item of items) ul.append(el("li", null, item));
            parent.append(ul);
        }

        function showDecision(d) {
            const box = el("div", "msg laya");
            const head = el("div");
            const badge = el("span", "badge", `P${d.priority} ${d.issue_type}`);
            badge.style.background = PRIORITY_COLORS[d.priority];
            head.append(badge, el("strong", null, `${d.team} team`),
                document.createTextNode(d.asset_id ? ` · ${d.asset_id}` : " · machine unclear"));
            box.append(head);
            addList(box, "Why", d.reason);
            addList(box, "Check first", d.first_checks);
            box.append(el("div", "meta", `Decision #${d.decision_id} · answered by ${d.model}`));
            chat.append(box);
            chat.scrollTop = chat.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();                      // stop the browser reloading the page
            const text = textInput.value.trim();
            if (!text) return;

            chat.append(el("div", "msg me", text));
            textInput.value = "";
            sendBtn.disabled = true;
            const waiting = el("div", "msg laya meta", "Laya is thinking…");
            chat.append(waiting);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch("/triage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        text,
                        at_time: timeInput.value,
                        operator_name: "Operator",
                    }),
                });
                const data = await response.json();
                waiting.remove();
                if (!response.ok) {
                    chat.append(el("div", "msg laya", `Error ${response.status}: ${JSON.stringify(data.detail)}`));
                    return;
                }
                showDecision(data);
            } catch (err) {
                waiting.remove();
                chat.append(el("div", "msg laya", `Could not reach the server: ${err}`));
            } finally {
                sendBtn.disabled = false;
                textInput.focus();
            }
        });
    </script>
</body>

</html>
